name: dashboard-repl-check
version: 0.1.0.0
github: "Qolari/Qolari"
license: AllRightsReserved
author: "Qolari"
maintainer: "Qolari"
copyright: "2026 Qolari Technologies"

description: Thin package whose sole purpose is to pull in both rider-dashboard and provider-dashboard so a single cabal repl covers the entire dashboard dep tree.

ghc-options:
  - -Wall
  - -Wcompat
  - -Werror
  - -Widentities
  - -Wunused-imports
  - -fwrite-ide-info
  - -hiedir=.hie

library:
  dependencies:
    - base
    - rider-dashboard
    - provider-dashboard
