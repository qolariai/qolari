<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#grad)"/>
  <!-- Steering wheel -->
  <circle cx="60" cy="55" r="28" stroke="white" stroke-width="5" fill="none"/>
  <circle cx="60" cy="55" r="8" fill="white"/>
  <line x1="60" y1="63" x2="60" y2="83" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="36" y1="45" x2="48" y2="52" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="84" y1="45" x2="72" y2="52" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Location pin dot -->
  <circle cx="60" cy="98" r="5" fill="white" opacity="0.8"/>
  <!-- Text -->
  <text x="60" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="white">QolariDriver</text>
</svg>
