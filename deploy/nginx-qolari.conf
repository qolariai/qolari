server {
    listen 80;
    listen [::]:80;
    server_name qolari.com www.qolari.com;
    return 301 https://qolari.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qolari.com www.qolari.com;

    ssl_certificate /etc/letsencrypt/live/qolari.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qolari.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/qolari/api/public;
    index index.php;
    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    # Laravel routes - all handled by PHP-FPM
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /filament {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        try_files $uri $uri/ =404;
    }

    # Laravel static assets (Filament CSS/JS/fonts)
    location ~* ^/(css|js|fonts)/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PHP-FPM handler
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-qolari.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # Deny hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
