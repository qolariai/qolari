server {
    server_name api.qolari.com;

    root /var/www/qolari/api/public;
    index index.php;
    client_max_body_size 50M;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    # Compat OpenAI / extensao: clientes apontam para /v1/* -> /api/v1/*
    location ^~ /v1/ {
        rewrite ^/v1/(.*)$ /api/v1/$1 break;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-qolari.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/qolari/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(css|js|fonts)/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-qolari.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.qolari.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.qolari.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.qolari.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.qolari.com;
    return 404; # managed by Certbot


}